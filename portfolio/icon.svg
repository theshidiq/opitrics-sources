<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Portfolio mark">
  <title>Kamal Abdul Shidiq</title>
  <!--
    A bar chart whose third column is a person: a round head above a body,
    standing taller than the surrounding data.

    Tuned for 16px, where the mark mostly lives. The head is a circle wider
    than the body, separated by a gap, so it reads as a head at a glance
    rather than merging into one bar. The single curve in an otherwise
    square mark is what makes it read as a person. The data columns are muted rather than
    full contrast, so the figure stays the focal point.

    A favicon cannot read the page's data-theme, so it follows the system
    scheme using the site's own tokens.
  -->
  <style>
    .bar  { fill: #5c5852; }
    .self { fill: #b4451f; }
    @media (prefers-color-scheme: dark) {
      .bar  { fill: #a8a49c; }
      .self { fill: #f0865a; }
    }
  </style>

  <!-- data columns -->
  <rect class="bar"  x="2"  y="19" width="6" height="11"/>
  <rect class="bar"  x="10" y="15" width="6" height="15"/>

  <!-- the person: round head, gap, body -->
  <circle class="self" cx="21" cy="6" r="4"/>
  <rect   class="self" x="18" y="12" width="6" height="18"/>

  <rect class="bar"  x="26" y="17" width="4" height="13"/>
</svg>
