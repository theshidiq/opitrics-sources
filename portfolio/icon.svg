<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Portfolio mark">
  <title>Kamal Abdul Shidiq</title>
  <!--
    A dot over a line, with three bars climbing to the right. The bars'
    sloped tops line up into one continuous rising edge, so the mark reads
    as a trend line and a bar chart at once.

    The stem carries the accent and the bars are muted, so the eye lands on
    the figure first and the data reads as its context.

    A favicon cannot read the page data-theme, so it follows the system
    scheme using the site's own tokens.
  -->
  <style>
    .stem { fill: #b4451f; }
    .bar  { fill: #5c5852; }
    @media (prefers-color-scheme: dark) {
      .stem { fill: #f0865a; }
      .bar  { fill: #a8a49c; }
    }
  </style>

  <!-- stem: dot over line -->
  <circle class="stem" cx="7" cy="4.5" r="3.5"/>
  <rect   class="stem" x="4" y="11" width="6" height="19"/>

  <!-- three bars whose sloped tops form a single rising edge -->
  <polygon class="bar" points="13,30 13,22 18,18 18,30"/>
  <polygon class="bar" points="20,30 20,17 25,13 25,30"/>
  <polygon class="bar" points="27,30 27,12 32,8 32,30"/>
</svg>
